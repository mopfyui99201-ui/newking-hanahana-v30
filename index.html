<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ニューキングハナハナV-30 設定判別</title>
<style>
  :root {
    --gold: #f5c542;
    --gold-hi: #ffe9a3;
    --gold-dk: #9a6b12;
    --red: #c8161e;
    --red-dk: #6e0d13;
    --black: #0a0a0c;
    --panel: #17181d;
    --lcd-bg: #05070c;
    --neon: #4dffb8;
    --txt: #f2ead8;
    --sub: #9a917e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { font-size: 15px; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1200px 600px at 50% -10%, #2a1218 0%, transparent 60%),
      radial-gradient(900px 500px at 50% 110%, #101c2a 0%, transparent 55%),
      #05060a;
    color: var(--txt);
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    padding: 14px 10px calc(30px + env(safe-area-inset-bottom));
    user-select: none;
  }

  /* ============ 筐体フレーム ============ */
  .cabinet {
    position: relative;
    max-width: 430px;
    margin: 0 auto;
    border-radius: 26px;
    padding: 14px 14px 18px;
    background:
      linear-gradient(160deg, #2a2a30 0%, #101014 30%, #1c1c22 60%, #0c0c10 100%);
    border: 3px solid #3a2c10;
    box-shadow:
      0 0 0 2px #0a0a0c,
      0 0 0 4px #6b4d15,
      0 0 40px rgba(200,22,30,.35),
      0 20px 60px rgba(0,0,0,.8),
      inset 0 1px 0 rgba(255,255,255,.12);
    overflow: hidden;
  }
  /* 左右の赤いサイドピラー */
  .cabinet::before, .cabinet::after {
    content: '';
    position: absolute; top: 0; bottom: 0; width: 16px;
    background: linear-gradient(180deg, var(--red) 0%, var(--red-dk) 55%, #3d070b 100%);
    box-shadow: inset 0 0 12px rgba(0,0,0,.7);
  }
  .cabinet::before { left: 0; border-right: 2px solid var(--gold-dk); }
  .cabinet::after { right: 0; border-left: 2px solid var(--gold-dk); }
  .cabinet-inner { position: relative; z-index: 2; padding: 0 4px; }

  /* ============ トップデッキ（金ロゴ＋ランプ） ============ */
  .top-deck {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px 12px;
    border-radius: 16px;
    background:
      linear-gradient(180deg, #1e1e26 0%, #101014 100%);
    border: 2px solid #4a3a14;
    box-shadow: inset 0 2px 8px rgba(0,0,0,.8), 0 1px 0 rgba(255,233,163,.15);
    position: relative;
    overflow: hidden;
  }
  .top-deck::after { /* 金の飾りライン */
    content:''; position:absolute; left:10px; right:10px; bottom:4px; height:2px;
    background: linear-gradient(90deg, transparent, var(--gold-dk) 20%, var(--gold) 50%, var(--gold-dk) 80%, transparent);
    opacity:.6;
  }
  .logo-block { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
  .hibiscus-svg { flex: 0 0 auto; filter: drop-shadow(0 0 6px rgba(255,90,120,.6)); }
  .logo-text {
    font-weight: 900;
    font-style: italic;
    letter-spacing: .02em;
    line-height: 1.05;
    font-size: clamp(1.05rem, 5.4vw, 1.5rem);
    background: linear-gradient(180deg, #fff6d8 0%, var(--gold-hi) 25%, var(--gold) 50%, #b8860b 78%, #ffe9a3 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    filter: drop-shadow(0 2px 0 #4a2f05) drop-shadow(0 0 10px rgba(245,197,66,.35));
  }
  .logo-sub {
    font-size: .62rem; font-weight: 800; letter-spacing: .28em; color: var(--red);
    text-shadow: 0 0 6px rgba(255,60,70,.7);
    margin-top: 2px;
  }
  .lamp-strip { display: flex; gap: 5px; align-items: center; }
  .lamp {
    width: 15px; height: 15px; border-radius: 50%;
    background: #1a1a20; border: 1px solid #333;
    transition: all .25s;
    position: relative;
  }
  .lamp.on { box-shadow: 0 0 10px 2px currentColor; border-color: currentColor; }
  .lamp.on::after {
    content:''; position:absolute; inset:2px; border-radius:50%;
    background: currentColor; opacity:.85;
    animation: lampPulse 1.1s ease-in-out infinite alternate;
  }
  @keyframes lampPulse { from { opacity:.55; } to { opacity:1; } }

  /* ============ リール窓（液晶モニター） ============ */
  .mid-deck {
    position: relative;
    margin: 12px 0 10px;
    padding: 0 26px;
  }
  .reel-frame {
    position: relative;
    border-radius: 18px;
    padding: 10px;
    background:
      linear-gradient(145deg, #5a5a64 0%, #2a2a32 30%, #4a4a55 55%, #1a1a20 100%);
    border: 2px solid var(--gold-dk);
    box-shadow:
      inset 0 2px 6px rgba(255,255,255,.15),
      inset 0 -3px 8px rgba(0,0,0,.8),
      0 4px 14px rgba(0,0,0,.7);
  }
  .reel-frame::before, .reel-frame::after { /* 窓の金属リベット */
    content:''; position:absolute; top:6px; bottom:6px; width:8px;
    background: radial-gradient(circle at 50% 20%, #ffe9a3, #8a6a1a 60%, #3a2c05);
    border-radius: 4px;
  }
  .reel-frame::before { left:6px; }
  .reel-frame::after { right:6px; }
  .lcd {
    position: relative;
    border-radius: 10px;
    background:
      radial-gradient(120% 90% at 50% 0%, #0d1526 0%, var(--lcd-bg) 55%, #02030a 100%);
    border: 1px solid #000;
    box-shadow: inset 0 0 30px rgba(40,120,200,.15), inset 0 0 4px #000;
    padding: 12px 12px 14px;
    overflow: hidden;
  }
  .lcd::after { /* 液晶スキャンライン */
    content:''; position:absolute; inset:0; pointer-events:none;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px);
  }
  .lcd-title {
    text-align:center; font-size:.62rem; letter-spacing:.3em; color:#5f7ba6;
    margin-bottom:8px; font-weight:700;
  }
  .lcd-total {
    text-align:center; font-size:1.5rem; font-weight:900; font-variant-numeric:tabular-nums;
    color: var(--neon);
    text-shadow: 0 0 12px rgba(77,255,184,.6), 0 0 3px var(--neon);
    margin-bottom: 10px;
  }
  .lcd-total small { font-size:.7rem; color:var(--sub); font-weight:400; margin-left:4px; }
  .prob-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:12px; }
  .prob-item {
    background: rgba(20,35,60,.5);
    border:1px solid #1d3355; border-radius:8px; padding:7px 2px; text-align:center;
  }
  .prob-item .p-name { font-size:.6rem; color:#7c93b8; letter-spacing:.1em; }
  .prob-item .p-val { font-size:.95rem; font-weight:800; color:#dff3ff; font-variant-numeric:tabular-nums; }

  .set-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .set-head .t { font-size:.62rem; letter-spacing:.25em; color:#5f7ba6; font-weight:700; }
  .set-head .h { font-size:.55rem; color:#41536f; }
  .set-row { display:flex; align-items:center; gap:8px; margin-bottom:7px; }
  .set-row .sname { flex:0 0 58px; font-size:.78rem; font-weight:700; color:var(--txt); }
  .set-row.excluded .sname { color:#5a5a64; text-decoration:line-through; }
  .bar-wrap { flex:1; height:18px; background:rgba(10,16,30,.8); border:1px solid #14233d; border-radius:5px; overflow:hidden; }
  .bar-fill { height:100%; width:0%; border-radius:4px; transition:width .5s cubic-bezier(.22,1,.36,1); position:relative; }
  .bar-fill::after {
    content:attr(data-pct); position:absolute; right:5px; top:50%; transform:translateY(-50%);
    font-size:.62rem; font-weight:800; color:#04121a;
    text-shadow:0 0 4px rgba(255,255,255,.8);
  }
  .bar-fill.dim { filter:grayscale(.8) brightness(.55); }

  /* ============ 下部操作パネル ============ */
  .bottom-panel {
    border-radius: 16px;
    background: linear-gradient(180deg, #20202a 0%, #121218 100%);
    border: 2px solid #4a3a14;
    box-shadow: inset 0 2px 8px rgba(0,0,0,.85), 0 1px 0 rgba(255,233,163,.12);
    padding: 12px;
  }
  .panel-title {
    text-align:center; font-size:.62rem; letter-spacing:.3em; color:var(--gold);
    font-weight:800; margin-bottom:10px;
    text-shadow:0 0 8px rgba(245,197,66,.4);
  }
  .field-row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .field-row .fname { flex:0 0 38%; font-size:.75rem; color:var(--sub); }
  .field-row input {
    flex:1; min-width:0; background:#0c0d12; border:1px solid #2c2c38; border-radius:8px;
    color:var(--txt); font-size:1rem; font-weight:800; padding:9px 10px; text-align:right; outline:none;
    font-variant-numeric:tabular-nums;
  }
  .field-row input:focus { border-color:var(--gold); }
  .auto-note { font-size:.6rem; color:var(--neon); }

  /* BIG/REG/ベル カウンタ（BET風ボタン） */
  .count-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:10px; }
  .count-box {
    background:#0c0d12; border:1px solid #2c2c38; border-radius:10px;
    padding:8px 6px; text-align:center;
  }
  .count-box .name { font-size:.62rem; color:var(--sub); letter-spacing:.08em; margin-bottom:4px; }
  .count-box input {
    width:100%; background:transparent; border:none; color:var(--gold-hi);
    font-size:1.3rem; font-weight:900; text-align:center; outline:none;
    font-variant-numeric:tabular-nums;
  }
  .count-box .step { display:flex; gap:5px; margin-top:6px; }
  .count-box .step button {
    flex:1; padding:9px 0; font-size:1rem; font-weight:900; border:none; border-radius:7px;
    cursor:pointer; color:#04121a;
  }
  .count-box .step button.p { background:linear-gradient(180deg,var(--neon),#1fae85); }
  .count-box .step button.m { background:linear-gradient(180deg,#5a6880,#3a4458); color:#dfe6f5; }
  .count-box .step button:active { transform:scale(.92); }

  /* 色別ランプカウントボタン */
  .lamp-sec-title { font-size:.65rem; color:var(--gold); letter-spacing:.15em; font-weight:800; margin:10px 0 6px; }
  .lamp-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; }
  .lamp-grid.five { grid-template-columns:repeat(5,1fr); }
  .lamp-btn {
    position:relative; border:1px solid #2c2c38; background:#0c0d12;
    border-radius:9px; padding:9px 2px 7px; color:var(--txt);
    font-size:.62rem; cursor:pointer; overflow:hidden;
  }
  .lamp-btn:active { transform:scale(.93); }
  .lamp-btn .dot { display:block; width:13px; height:13px; border-radius:50%; margin:0 auto 4px; box-shadow:0 0 7px currentColor; }
  .lamp-btn .cnt { position:absolute; top:3px; right:5px; font-size:.6rem; font-weight:800; color:var(--neon); font-variant-numeric:tabular-nums; }
  .lamp-btn.zero .cnt { color:#4a4a55; }

  /* スイカカウンタ */
  .suika-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  .suika-box { background:#0c0d12; border:1px solid #2c2c38; border-radius:10px; padding:9px; text-align:center; }
  .suika-box .name { font-size:.62rem; color:var(--sub); margin-bottom:5px; }
  .suika-box .num { font-size:1.5rem; font-weight:900; color:var(--gold-hi); font-variant-numeric:tabular-nums; }
  .suika-box .mini { display:flex; gap:6px; margin-top:7px; }
  .suika-box .mini button { flex:1; padding:9px 0; font-size:1rem; font-weight:900; border:none; border-radius:7px; cursor:pointer; }
  .suika-box .mini button.p { background:linear-gradient(180deg,var(--neon),#1fae85); color:#04121a; }
  .suika-box .mini button.m { background:#3a4458; color:#dfe6f5; }
  .suika-box .mini button:active { transform:scale(.93); }

  /* 設定除外チップ */
  .excl-grid { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .excl-chip {
    flex:1 1 30%; min-width:70px; padding:8px 4px; border-radius:8px; text-align:center;
    font-size:.68rem; font-weight:800; border:1px solid #2c2c38; background:#0c0d12;
    color:var(--txt); cursor:pointer;
  }
  .excl-chip.on { border-color:var(--red); color:#ff8a95; background:rgba(200,22,30,.18); }
  .excl-chip:active { transform:scale(.94); }

  .btn-reset {
    width:100%; margin-top:12px; padding:14px; border:none; border-radius:12px;
    background:linear-gradient(90deg,var(--red),#ff8a5c); color:#fff;
    font-size:.85rem; font-weight:900; letter-spacing:.15em; cursor:pointer;
  }
  .btn-reset:active { transform:scale(.97); }
  .saved-note { text-align:center; font-size:.6rem; color:#4a4a55; margin-top:8px; }

  /* 消音ボタン（画面右上・ホール実戦対応） */
  .mute-btn {
    position: fixed; top: calc(10px + env(safe-area-inset-top)); right: 10px; z-index: 99;
    padding: 9px 14px; border-radius: 20px;
    border: 2px solid #4a3a14;
    background: linear-gradient(180deg, #2a2a32, #14141a);
    color: var(--txt); font-size: .78rem; font-weight: 800; letter-spacing: .05em;
    cursor: pointer; box-shadow: 0 3px 10px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.12);
  }
  .mute-btn:active { transform: scale(.93); }
  .mute-btn.muted { border-color: #5a3a3a; color: #c9a0a0; }
  .mute-btn.unmuted { border-color: var(--neon); color: var(--neon); box-shadow: 0 0 12px rgba(77,255,184,.35); }
</style>
</head>
<body>

<!-- ハイビスカスSVGシンボル（defs） -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="hibiscus">
      <g fill="#ff3b5c">
        <ellipse cx="0" cy="-11" rx="6.5" ry="11"/>
        <ellipse cx="0" cy="-11" rx="6.5" ry="11" transform="rotate(72)"/>
        <ellipse cx="0" cy="-11" rx="6.5" ry="11" transform="rotate(144)"/>
        <ellipse cx="0" cy="-11" rx="6.5" ry="11" transform="rotate(216)"/>
        <ellipse cx="0" cy="-11" rx="6.5" ry="11" transform="rotate(288)"/>
      </g>
      <circle r="5.5" fill="#ffd166"/>
      <circle r="2.6" fill="#c8161e"/>
      <g stroke="#ffb3c0" stroke-width="1" opacity=".7">
        <line x1="0" y1="0" x2="0" y2="-14"/>
      </g>
    </g>
  </defs>
</svg>

<button class="mute-btn muted" id="muteBtn">🔇 消音</button>

<div class="cabinet">
<div class="cabinet-inner">

  <!-- ===== トップデッキ：黄金ロゴ＋点灯ランプ ===== -->
  <div class="top-deck">
    <div class="logo-block">
      <svg class="hibiscus-svg" width="46" height="46" viewBox="-20 -20 40 40"><use href="#hibiscus"/></svg>
      <div>
        <div class="logo-text">NEW KING<br>HANAHANA</div>
        <div class="logo-sub">V-30</div>
      </div>
    </div>
    <div class="lamp-strip" id="lampStrip"></div>
  </div>

  <!-- ===== リール窓＝液晶モニター ===== -->
  <div class="mid-deck">
    <div class="reel-frame">
      <div class="lcd">
        <div class="lcd-title">SETTING PREDICTOR</div>
        <div class="lcd-total"><span id="lcdTotalG">0</span><small>総G</small></div>
        <div class="prob-grid" id="probGrid"></div>
        <div class="set-head">
          <span class="t">設定期待度</span>
          <span class="h">タップで除外 / 下部パネルでも可</span>
        </div>
        <div id="settingRows"></div>
      </div>
    </div>
  </div>

  <!-- ===== 下部操作パネル ===== -->
  <div class="bottom-panel">
    <div class="panel-title">— CONTROL PANEL —</div>

    <div class="field-row">
      <span class="fname">打ち始めG</span>
      <input type="number" id="startG" inputmode="numeric" min="0" placeholder="0">
    </div>
    <div class="field-row">
      <span class="fname">現在G <span class="auto-note" id="totalGNote"></span></span>
      <input type="number" id="currentG" inputmode="numeric" min="0" placeholder="0">
    </div>
    <div class="field-row">
      <span class="fname">総ゲーム数</span>
      <input type="number" id="totalG" inputmode="numeric" min="0" placeholder="自動計算">
    </div>

    <div class="lamp-sec-title">回数カウント</div>
    <div class="count-grid">
      <div class="count-box"><div class="name">BIG</div><input id="num_big" type="number" inputmode="numeric" min="0" value="0"><div class="step"><button class="m" data-key="big" data-d="-1">−</button><button class="p" data-key="big" data-d="1">＋</button></div></div>
      <div class="count-box"><div class="name">REG</div><input id="num_reg" type="number" inputmode="numeric" min="0" value="0"><div class="step"><button class="m" data-key="reg" data-d="-1">−</button><button class="p" data-key="reg" data-d="1">＋</button></div></div>
      <div class="count-box"><div class="name">ベル</div><input id="num_bell" type="number" inputmode="numeric" min="0" placeholder="任意"><div class="step"><button class="m" data-key="bell" data-d="-1">−</button><button class="p" data-key="bell" data-d="1">＋</button></div></div>
    </div>

    <div class="lamp-sec-title">ボーナス終了時ハイビスカスランプ</div>
    <div class="lamp-grid" id="hibiscusGrid"></div>

    <div class="lamp-sec-title">BIG後半 ビタ押しサイドランプ</div>
    <div class="lamp-grid five" id="sideGrid"></div>

    <div class="lamp-sec-title">スイカ示唆</div>
    <div class="suika-grid">
      <div class="suika-box">
        <div class="name">REG中 スイカ揃い</div>
        <div class="num" id="regSuikaNum">0</div>
        <div class="mini"><button class="p" data-suika="reg" data-d="1">+1</button><button class="m" data-suika="reg" data-d="-1">-1</button></div>
      </div>
      <div class="suika-box">
        <div class="name">BIG前半 スイカ出現</div>
        <div class="num" id="bigSuikaNum">0</div>
        <div class="mini"><button class="p" data-suika="big" data-d="1">+1</button><button class="m" data-suika="big" data-d="-1">-1</button></div>
      </div>
    </div>

    <div class="lamp-sec-title">設定除外</div>
    <div class="excl-grid" id="exclGrid"></div>

    <button class="btn-reset" id="resetBtn">リセット</button>
    <div class="saved-note" id="savedNote">入力は自動保存されます</div>
  </div>
</div>
</div>

<script src="calc.js"></script>
<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const LS_KEY = 'hanahana-v30-state-v1';

  const state = {
    startG: '', currentG: '', totalG: '',
    big: 0, reg: 0, bell: '',
    lamps: {
      hibiscus: { white:0, blue:0, yellow:0, green:0, purple:0, rainbow:0 },
      side:     { blue:0, yellow:0, green:0, red:0, rainbow:0 },
      regSuika: 0, bigSuika: 0
    },
    excluded: {}
  };

  const HIBISCUS_COLORS = ['white','blue','yellow','green','purple','rainbow'];
  const SIDE_COLORS = ['blue','yellow','green','red','rainbow'];
  const NEON = ['#4dffb8','#35e0c8','#7c6cff','#ff8a5c','#ff5470','#ffd166','#f368e0','#7cc7ff'];

  // トップランプ: 虹 紫 赤 緑 黄 青 白（ハイビスカス色と連動）
  const TOP_LAMPS = [
    { key:'rainbow', color:'#ff5ad0' },
    { key:'purple',  color:'#b57bff' },
    { key:'red',     color:'#ff3b5c' },
    { key:'green',   color:'#4dffb8' },
    { key:'yellow',  color:'#ffd166' },
    { key:'blue',    color:'#35e0c8' },
    { key:'white',   color:'#e8edf7' }
  ];
  // ハイビスカスカウントキー → トップランプキー（redは虹に近い赤として赤ランプへ）
  const HIB_TO_TOP = { white:'white', blue:'blue', yellow:'yellow', green:'green', purple:'purple', rainbow:'rainbow' };

  /* ============ Web Audio API 効果音（全てリアルタイム合成・著作権フリー） ============ */
  const LS_MUTE = 'hanahana-v30-muted';
  let audioCtx = null, masterGain = null;
  // 安全のためデフォルトは消音。'0' が保存されていれば音ON
  let muted = localStorage.getItem(LS_MUTE) !== '0';

  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = muted ? 0 : 1;
      masterGain.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function tone(freq, t0, dur, type, vol, slideTo) {
    const ctx = audioCtx;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(masterGain);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }

  // リール停止ボタン風の軽快なタップ音
  function sfxTap(soft) {
    if (muted) return;
    const ctx = ensureAudio(); if (!ctx) return;
    const t = ctx.currentTime;
    tone(soft ? 900 : 1350, t, 0.06, 'square', soft ? 0.08 : 0.13, soft ? 500 : 750);
    tone(2400, t, 0.03, 'sine', 0.05);
  }

  // ハイビスカス点灯風キラキラチャイム。fancy=trueで虹・紫などの豪華な上昇和音
  function sfxChime(fancy) {
    if (muted) return;
    const ctx = ensureAudio(); if (!ctx) return;
    const t0 = ctx.currentTime;
    const notes = fancy
      ? [1046.5, 1318.5, 1568.0, 2093.0, 2637.0]   // C6 E6 G6 C7 E7 の豪華アルペジオ
      : [1318.5, 1568.0, 2093.0];                  // E6 G6 C7
    notes.forEach((f, i) => tone(f, t0 + i * 0.065, 0.45, 'sine', 0.14));
    if (fancy) tone(4186, t0 + notes.length * 0.065, 0.5, 'sine', 0.07); // キラッとした高音の余韻
  }

  // リセット時の下降クリアトーン
  function sfxClear() {
    if (muted) return;
    const ctx = ensureAudio(); if (!ctx) return;
    const t = ctx.currentTime;
    tone(880, t, 0.18, 'triangle', 0.15, 660);
    tone(660, t + 0.16, 0.18, 'triangle', 0.15, 440);
    tone(440, t + 0.32, 0.35, 'triangle', 0.12, 220);
  }

  function refreshMuteBtn() {
    const b = $('muteBtn');
    b.textContent = muted ? '🔇 消音' : '🔊 音ON';
    b.classList.toggle('muted', muted);
    b.classList.toggle('unmuted', !muted);
    if (masterGain) masterGain.gain.value = muted ? 0 : 1;
  }
  $('muteBtn').addEventListener('click', () => {
    muted = !muted;
    try { localStorage.setItem(LS_MUTE, muted ? '1' : '0'); } catch (e) {}
    refreshMuteBtn();
    if (!muted) sfxTap(); // ONにした瞬間に確認音
  });

  function colorLabel(c) {
    return { white:'白', blue:'青', yellow:'黄', green:'緑', purple:'紫', red:'赤' }[c] || c;
  }
  function colorHex(c) {
    return {
      white:'#e8edf7', blue:'#35e0c8', yellow:'#ffd166', green:'#4dffb8',
      purple:'#b57bff', red:'#ff5470', rainbow:'#888'
    }[c] || '#888';
  }
  function lampCss(color) {
    return color === 'rainbow'
      ? 'conic-gradient(#ff5470,#ffd166,#4dffb8,#35e0c8,#7c6cff,#f368e0,#ff5470)'
      : colorHex(color);
  }

  // ---------- トップランプ生成 ----------
  function buildTopLamps() {
    const strip = $('lampStrip');
    TOP_LAMPS.forEach(l => {
      const d = document.createElement('div');
      d.className = 'lamp';
      d.id = 'toplamp_' + l.key;
      d.style.color = l.color;
      strip.appendChild(d);
    });
  }
  function syncTopLamps() {
    TOP_LAMPS.forEach(l => {
      const el = $('toplamp_' + l.key);
      if (!el) return;
      const cnt = (state.lamps.hibiscus[l.key] || 0);
      el.classList.toggle('on', cnt > 0);
    });
  }

  // ---------- 色別ランプカウントボタン ----------
  function buildLamps(gridId, colors, lampKey) {
    const grid = $(gridId);
    colors.forEach(color => {
      const btn = document.createElement('button');
      btn.className = 'lamp-btn' + (state.lamps[lampKey][color] === 0 ? ' zero' : '');
      btn.dataset.color = color;
      btn.dataset.lamp = lampKey;
      btn.innerHTML =
        '<span class="cnt">' + state.lamps[lampKey][color] + '</span>' +
        '<span class="dot" style="background:' + lampCss(color) + ';color:' + lampCss(color) + '"></span>' +
        colorLabel(color);
      const bump = delta => {
        state.lamps[lampKey][color] = Math.max(0, (state.lamps[lampKey][color] || 0) + delta);
        btn.querySelector('.cnt').textContent = state.lamps[lampKey][color];
        btn.classList.toggle('zero', state.lamps[lampKey][color] === 0);
        // +1: 色に応じたチャイム（赤・紫・虹は豪華版）。-1: ソフトタップ
        if (delta > 0) {
          const fancy = color === 'purple' || color === 'rainbow' || color === 'red';
          sfxChime(fancy);
        } else {
          sfxTap(true);
        }
        update();
      };
      btn.addEventListener('click', () => bump(1));
      // 長押しで-1
      let timer = null;
      const start = () => { timer = setTimeout(() => { bump(-1); timer = 'repeat'; }, 550); };
      const stop = () => {
        if (timer && timer !== 'repeat') clearTimeout(timer);
        else if (timer === 'repeat') { /* 長押し中の連続減算は省略 */ }
        timer = null;
      };
      btn.addEventListener('touchstart', start);
      btn.addEventListener('touchend', stop);
      btn.addEventListener('touchcancel', stop);
      btn.addEventListener('mousedown', start);
      btn.addEventListener('mouseup', stop);
      btn.addEventListener('mouseleave', stop);
      grid.appendChild(btn);
    });
  }

  // ---------- 設定行（液晶内バー）＋除外チップ ----------
  function buildSettings() {
    const rows = $('settingRows');
    const chips = $('exclGrid');
    HanahanaCalc.SETTING_ORDER.forEach((key, i) => {
      const s = HanahanaCalc.HANAHANA_SETTINGS[key];
      const row = document.createElement('div');
      row.className = 'set-row' + (state.excluded[key] ? ' excluded' : '');
      row.innerHTML =
        '<span class="sname">' + s.name + '</span>' +
        '<div class="bar-wrap"><div class="bar-fill" id="bar_' + key + '" style="background:' + NEON[i % NEON.length] + '"></div></div>';
      rows.appendChild(row);

      const chip = document.createElement('button');
      chip.className = 'excl-chip' + (state.excluded[key] ? ' on' : '');
      chip.textContent = s.name;
      chip.addEventListener('click', () => {
        state.excluded[key] = !state.excluded[key];
        chip.classList.toggle('on', state.excluded[key]);
        row.classList.toggle('excluded', state.excluded[key]);
        sfxTap(true);
        update();
      });
      chips.appendChild(chip);
    });
  }

  // ---------- カウンタ入力 ----------
  document.querySelectorAll('.count-box .step button').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.key;
      const cur = state[key] === '' ? 0 : (parseInt(state[key], 10) || 0);
      state[key] = Math.max(0, cur + parseInt(btn.dataset.d, 10));
      $('num_' + key).value = state[key] === '' ? 0 : state[key];
      sfxTap(); // リール停止ボタン風タップ音
      update();
    });
  });
  ['big','reg','bell'].forEach(key => {
    $('num_' + key).addEventListener('input', e => {
      const v = e.target.value;
      state[key] = v === '' ? '' : Math.max(0, parseInt(v, 10) || 0);
      update();
    });
  });
  ['startG','currentG','totalG'].forEach(key => {
    $(key).addEventListener('input', e => { state[key] = e.target.value; update(); });
  });

  // ---------- スイカ ----------
  document.querySelectorAll('[data-suika]').forEach(btn => {
    btn.addEventListener('click', () => {
      const which = btn.dataset.suika === 'reg' ? 'regSuika' : 'bigSuika';
      const d = parseInt(btn.dataset.d, 10);
      state.lamps[which] = Math.max(0, (state.lamps[which] || 0) + d);
      if (d > 0) sfxChime(true); else sfxTap(true); // スイカは高設定示唆扱い
      update();
    });
  });

  // ---------- 計算・描画 ----------
  function getTotalGames() {
    if (state.totalG !== '' && !isNaN(parseInt(state.totalG, 10))) return parseInt(state.totalG, 10);
    const s = parseInt(state.startG, 10) || 0;
    const c = parseInt(state.currentG, 10) || 0;
    return Math.max(0, c - s);
  }
  function observedFreq(total, count) {
    if (!total || total <= 0) return null;
    return total / Math.max(0, count);
  }

  function update() {
    const total = getTotalGames();
    $('lcdTotalG').textContent = total.toLocaleString();
    $('totalGNote').textContent = (state.totalG === '' && total > 0) ? '（総G=' + total + '）' : '';

    const probs = [
      ['BIG', observedFreq(total, state.big|0)],
      ['REG', observedFreq(total, state.reg|0)],
      ['合算', observedFreq(total, (state.big|0) + (state.reg|0))],
      ['ベル', state.bell === '' ? null : observedFreq(total, state.bell|0)]
    ];
    $('probGrid').innerHTML = probs.map(([name, f]) =>
      '<div class="prob-item"><div class="p-name">' + name + '</div>' +
      '<div class="p-val">' + (f ? '1/' + f.toFixed(1) : '—') + '</div></div>'
    ).join('');

    $('regSuikaNum').textContent = state.lamps.regSuika;
    $('bigSuikaNum').textContent = state.lamps.bigSuika;

    const excluded = HanahanaCalc.SETTING_ORDER.filter(k => state.excluded[k]);
    const calcState = {
      totalG: total,
      big: state.big === '' ? 0 : state.big,
      reg: state.reg === '' ? 0 : state.reg,
      bell: state.bell === '' ? null : state.bell,
      lamps: state.lamps
    };
    const { probabilities } = HanahanaCalc.calculateHanahanaProbabilities(calcState, { excluded });

    HanahanaCalc.SETTING_ORDER.forEach((key, i) => {
      const p = probabilities[key] || 0;
      const pct = (p * 100).toFixed(1);
      const bar = $('bar_' + key);
      if (bar) {
        bar.style.width = pct + '%';
        bar.dataset.pct = pct + '%';
        bar.classList.toggle('dim', state.excluded[key]);
        bar.style.background = NEON[i % NEON.length];
      }
    });

    syncTopLamps();
    save();
  }

  // ---------- 永続化 ----------
  function save() {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(state));
      $('savedNote').textContent = '自動保存済み ' + new Date().toLocaleTimeString('ja-JP', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
    } catch (e) {}
  }
  function restore() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      ['startG','currentG','totalG','big','reg','bell'].forEach(k => { if (d[k] !== undefined) state[k] = d[k]; });
      if (d.lamps) {
        Object.assign(state.lamps.hibiscus, d.lamps.hibiscus || {});
        Object.assign(state.lamps.side, d.lamps.side || {});
        state.lamps.regSuika = d.lamps.regSuika || 0;
        state.lamps.bigSuika = d.lamps.bigSuika || 0;
      }
      if (d.excluded) state.excluded = d.excluded;
    } catch (e) {}
  }

  $('resetBtn').addEventListener('click', () => {
    if (!confirm('全データをリセットしますか？\n（localStorageも消去されます）')) return;
    sfxClear(); // 下降クリアトーン
    localStorage.removeItem(LS_KEY);
    location.reload();
  });

  // ---------- 初期化 ----------
  buildTopLamps();
  buildLamps('hibiscusGrid', HIBISCUS_COLORS, 'hibiscus');
  buildLamps('sideGrid', SIDE_COLORS, 'side');
  buildSettings();
  restore();
  $('startG').value = state.startG;
  $('currentG').value = state.currentG;
  $('totalG').value = state.totalG;
  $('num_big').value = state.big === '' ? '' : state.big;
  $('num_reg').value = state.reg === '' ? '' : state.reg;
  $('num_bell').value = state.bell === '' ? '' : state.bell;
  refreshMuteBtn();
  update();
})();
</script>
</body>
</html>
